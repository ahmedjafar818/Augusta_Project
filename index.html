@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f141b;--card:#171e28;--tx:#e7ecf3;--mu:#98a3b3;--bd:#263040;--pl:#6f9bd1;--ac:#f09a4a}}
:root[data-theme="dark"]{--bg:#0f141b;--card:#171e28;--tx:#e7ecf3;--mu:#98a3b3;--bd:#263040;--pl:#6f9bd1;--ac:#f09a4a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:16px;max-width:1200px;margin:auto}
header{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:14px}
h1{font-size:22px;margin:0}header p{margin:2px 0 0;color:var(--mu);font-size:13px}h2{font-size:14px;margin:0 0 10px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ctl{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mu)}select,.btn{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font:inherit;cursor:pointer}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.kpis,.cats,.charts{display:grid;gap:12px;margin-bottom:12px}.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.cats{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.charts{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis small{color:var(--mu);display:block}.kpis b{font-size:26px;display:block;line-height:1.2}.kpis em{font-style:normal;font-size:12px;color:var(--mu)}
.ok{color:var(--ok)!important}.wa{color:var(--wa)!important}.bad{color:var(--bad)!important}
.r{margin:8px 0}.rl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu)}.r.big .rl{font-size:14px;color:var(--tx);font-weight:600}
.bar{height:7px;background:var(--bd);border-radius:5px;margin-top:3px;overflow:hidden}.r.big .bar{height:10px}.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .6s ease}.pl{background:var(--pl)}.ac{background:var(--ac)}
.lg{font-size:12px;color:var(--mu);margin-bottom:10px}.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--pl)}.lg span+span::before{background:var(--ac)}.lg span+span{margin-left:12px}
.cv{position:relative;height:300px}#msg{color:var(--bad);font-size:13px;margin:0 0 8px}
</style></head><body>

const $=id=>document.getElementById(id),MN="Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec".split(" ");
const fd=s=>{const[y,m,d]=s.split("-");return+d+" "+MN[m-1]+" "+y.slice(2)};
const G=[["Engineering",2,[3,4,5],["Residential","Administrative","Commercial"]],["Procurement",6,[7,8,9],["Residential","Admin","Free issue"]],["Construction Works",10,[11,12,13],["Residential","Administration","Commercial"]],["Closeout",14,[15,16],["Testing and Commissioning","Handing over"]]];
let D,sel,ch1,ch2;
const cs=a=>{let s=0;return a.map(v=>s+=v||0)},pc=(c,r,i)=>D.D[r]?c[r][i]/D.D[r]:null,f1=v=>v==null?"-":(v*100).toFixed(1)+"%";
const chip=s=>s>=.95?"ok":s>=.85?"wa":"bad",lbl={ok:"On track",wa:"Watch",bad:"Behind"};
async function inflate(b){const u=Uint8Array.from(atob(b),c=>c.charCodeAt(0));return JSON.parse(await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"))).text())}
const row=(r,n,big)=>`<div class="r${big?" big":""}"><div class="rl"><span>${n}</span><span id="t${r}"></span></div><div class="bar"><i class="pl" id="p${r}"></i></div><div class="bar"><i class="ac" id="a${r}"></i></div></div>`;
function init(){D.cp=D.P.map(cs);D.ce=D.E.map(cs);
$("dd").innerHTML=D.dates.slice(0,D.last+1).map((d,k)=>`<option value="${k}">${fd(d)}</option>`).join("");$("dd").value=D.last;
$("cats").innerHTML=G.map(([t,r,s,n])=>`<div class="card"><h2>${t}</h2>${row(r,"Overall",1)}${s.map((x,j)=>row(x,n[j])).join("")}</div>`).join("");mk();render(D.last)}
function mk(){[ch1,ch2].forEach(c=>c&&c.destroy());const v=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();Chart.defaults.color=v("--mu");Chart.defaults.font.size=12;
const gr={color:v("--bd")},base={maintainAspectRatio:false,interaction:{mode:"index",intersect:false},plugins:{legend:{position:"bottom"}}};
ch1=new Chart($("c1"),{type:"line",data:{labels:D.dates.map(fd),datasets:[{label:"Planned",data:[],borderColor:v("--pl"),pointRadius:0,borderWidth:2},{label:"Actual",data:[],borderColor:v("--ac"),pointRadius:0,borderWidth:2.5}]},
options:{...base,scales:{x:{ticks:{maxTicksLimit:8},grid:{display:false}},y:{min:0,max:1,ticks:{callback:x=>Math.round(x*100)+"%"},grid:gr}},plugins:{...base.plugins,tooltip:{callbacks:{label:c=>c.dataset.label+": "+f1(c.parsed.y)}}}},
plugins:[{id:"vl",afterDatasetsDraw(c){const x=c.scales.x.getPixelForValue(sel),a=c.chartArea,g=c.ctx;g.save();g.strokeStyle=v("--mu");g.setLineDash([4,4]);g.beginPath();g.moveTo(x,a.top);g.lineTo(x,a.bottom);g.stroke();g.restore()}}]});
ch2=new Chart($("c2"),{data:{labels:[],datasets:[{type:"bar",label:"Weekly SPI",data:[],borderRadius:4},{type:"line",label:"Cumulative SPI",data:[],borderColor:v("--pl"),backgroundColor:v("--pl"),tension:.25},{type:"line",label:"Target 1.0",data:[],borderColor:v("--mu"),borderDash:[5,5],pointRadius:0,borderWidth:1}]},
options:{...base,scales:{x:{grid:{display:false}},y:{min:0,grid:gr}},plugins:{...base.plugins,tooltip:{callbacks:{label:c=>c.dataset.label+": "+c.parsed.y.toFixed(2)}}}}})}
function render(i){sel=i;const P=pc(D.cp,0,i),A=pc(D.ce,0,i),cp=D.cp[0][i],cumS=cp?D.ce[0][i]/cp:0,wS=D.P[0][i]?D.E[0][i]/D.P[0][i]:0,vr=(A-P)*100,cl=getComputedStyle(document.documentElement);
$("sub").textContent="Weekly progress report - data date "+fd(D.dates[i]);
const K=[["Planned (overall)",f1(P),"cumulative",""],["Actual (overall)",f1(A),"cumulative",""],["Variance",(vr>0?"+":"")+vr.toFixed(1)+" pp",vr>=0?"ahead of plan":"behind plan",vr>=-.05?"ok":vr>-3?"wa":"bad"],["Cumulative SPI",cumS.toFixed(2),lbl[chip(cumS)],chip(cumS)],["Weekly SPI",wS.toFixed(2),lbl[chip(wS)],chip(wS)]];
$("kpis").innerHTML=K.map(k=>`<div class="card"><small>${k[0]}</small><b class="${k[3]}">${k[1]}</b><em>${k[2]}</em></div>`).join("");
G.forEach(([t,r,s])=>[r,...s].forEach(x=>{const p=pc(D.cp,x,i),a=pc(D.ce,x,i);$("p"+x).style.width=(p||0)*100+"%";$("a"+x).style.width=(a||0)*100+"%";$("t"+x).textContent=f1(p)+" / "+f1(a)}));
ch1.data.datasets[0].data=D.cp[0].map(x=>x/D.D[0]);ch1.data.datasets[1].data=D.ce[0].map((x,k)=>k<=i?x/D.D[0]:null);ch1.update();
const a=Math.max(0,i-7),ks=[...Array(i-a+1)].map((_,j)=>a+j),w=ks.map(k=>D.P[0][k]?D.E[0][k]/D.P[0][k]:0),cc={ok:"--ok",wa:"--wa",bad:"--bad"};
ch2.data.labels=ks.map(k=>fd(D.dates[k]));ch2.data.datasets[0].data=w;ch2.data.datasets[0].backgroundColor=w.map(x=>cl.getPropertyValue(cc[chip(x)]).trim());ch2.data.datasets[1].data=ks.map(k=>D.ce[0][k]/D.cp[0][k]);ch2.data.datasets[2].data=ks.map(()=>1);ch2.update()}
function parse(wb){const rd=n=>XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:true,defval:null}),P=rd("Planned Data"),E=rd("Earned Value Data (AC)"),dates=[];
for(let c=5;P[0][c] instanceof Date;c++){const d=new Date(P[0][c].getTime()+432e5);dates.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"))}
const n=dates.length,u=S=>[...Array(17)].map((_,j)=>S[j+1].slice(5,5+n).map(v=>+v||0));
const e=u(E);let last=0;e[0].forEach((v,k)=>{if(v>0)last=k});return{dates,D:[...Array(17)].map((_,j)=>+P[j+1][3]||0),P:u(P),E:e,last}}
$("dd").onchange=e=>render(+e.target.value);
$("up").onchange=async e=>{const f=e.target.files[0];if(!f)return;$("msg").textContent="";try{D=parse(XLSX.read(await f.arrayBuffer(),{type:"array",cellDates:true}));init()}catch(x){$("msg").textContent="Could not read this file. Use the same sheet layout (Planned Data and Earned Value Data (AC))."}e.target.value=""};
matchMedia("(prefers-color-scheme: dark)").onchange=()=>D&&(mk(),render(sel));
inflate(DATA).then(d=>{D=d;init()}).catch(()=>$("msg").textContent="Could not load the embedded data.");
</script></body></html>
